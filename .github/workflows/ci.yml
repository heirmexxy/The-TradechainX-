name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install libraries
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.1.0 --no-git
          forge install foundry-rs/forge-std --no-git
      - run: forge build --sizes
      - run: forge test -vv
      - run: forge coverage --report summary
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-out
          path: contracts/out

  slither:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install libraries
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.1.0 --no-git
          forge install foundry-rs/forge-std --no-git
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          slither-args: --filter-paths "lib/|legacy/|test/|mocks/" --exclude-informational
          fail-on: high

  apps:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contracts-out
          path: contracts/out
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm generate
      - run: pnpm test:domain
      - run: pnpm test:sdk
      - run: pnpm typecheck
      - run: pnpm --filter @tradechainx/api test
      - name: Build web
        run: pnpm --filter @tradechainx/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_CHAIN_ID: 31337
          NEXT_PUBLIC_RPC_URL: http://127.0.0.1:8545
          NEXT_PUBLIC_WALLET_PROVIDER: dev
          NEXT_PUBLIC_ALLOW_DEV_WALLET: "true"

  e2e-chain:
    runs-on: ubuntu-latest
    needs: contracts
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install libraries
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.1.0 --no-git
          forge install foundry-rs/forge-std --no-git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to a local chain and run the smoke journey
        run: |
          anvil --silent &
          sleep 2
          ./deploy-local.sh
          ./smoke-local.sh

  docker:
    # Proves the production images build. Uses a throwaway local-chain config for the web build args.
    runs-on: ubuntu-latest
    needs: apps
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t tradechainx-api:ci .
      - run: >
          docker build -f apps/web/Dockerfile -t tradechainx-web:ci
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.com
          --build-arg NEXT_PUBLIC_CHAIN_ID=31337
          --build-arg NEXT_PUBLIC_RPC_URL=http://127.0.0.1:8545
          --build-arg NEXT_PUBLIC_WALLET_PROVIDER=privy
          --build-arg NEXT_PUBLIC_PRIVY_APP_ID=ci-placeholder .
